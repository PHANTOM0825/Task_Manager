[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmanager"
version = "1.0.0"
description = "A secure, well-tested Task Management library demonstrating CI/CD best practices."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Week6 CI Task", email = "student@example.com"}
]
keywords = ["task", "management", "ci", "cd", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = []   # zero runtime dependencies — stdlib only

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "flake8>=6.1",
    "black>=23.9",
    "isort>=5.12",
    "mypy>=1.6",
    "bandit[toml]>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taskmanager*"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["taskmanager/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["taskmanager"]
omit = ["taskmanager/tests/*", "*/migrations/*"]
branch = true   # measure branch coverage (if/else paths)

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85   # CI fails if coverage drops below 85%
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "reports/htmlcov"
title = "TaskManager Coverage Report"

# ---------------------------------------------------------------------------
# flake8 configuration (via setup.cfg or here via pyproject.toml comments)
# ---------------------------------------------------------------------------
# Note: flake8 reads from setup.cfg/.flake8; settings shown in CI YAML above.

# ---------------------------------------------------------------------------
# black configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# isort configuration
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["taskmanager"]

# ---------------------------------------------------------------------------
# mypy configuration
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit configuration
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["taskmanager/tests"]
skips = []   # no skips — all checks active
